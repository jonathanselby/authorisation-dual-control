name: test

on:
  push:
  pull_request:

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Format contract
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Unit tests with race detector
        run: go test -race -count=1 ./...
      - name: Build
        run: go build -o ./bin/authzcheck ./cmd/authzcheck
      - name: Version contract
        run: test "$(./bin/authzcheck -version)" = "authzcheck 0.1.0"
      - name: Linux arm64 build
        run: GOOS=linux GOARCH=arm64 go build -o ./bin/authzcheck-linux-arm64 ./cmd/authzcheck
      - name: Bafflewick acceptance
        shell: bash
        run: |
          out=$(./bin/authzcheck -policy examples/bafflewick/policy.json -request examples/bafflewick/request.json)
          echo "$out" | grep -q '"allowed":true'
          echo "$out" | grep -q '"human_id":"major-1"'
          echo "$out" | grep -q '"agent_id":"agent-1"'
      - name: Policy-boundary acceptance
        run: >-
          go test ./internal/authz
          -run 'TestCompartmentAndIncidentScope|TestRoles|TestMakerCheckerRequiresPolicyControlledException|TestAgentInheritsNamedHumanOnly|TestValidatePolicy|TestMalformedRequestAndUnknownActionAreErrors'
          -count=1
