name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Vet
        run: go vet ./...
      - name: Unit tests with race detector
        run: go test -race ./...
      - name: Build
        run: go build -o ./bin/authzcheck ./cmd/authzcheck
      - name: Version contract
        run: test "$(./bin/authzcheck -version)" = "authzcheck 0.1.0"
      - name: Linux arm64 build
        run: GOOS=linux GOARCH=arm64 go build -o ./bin/authzcheck-linux-arm64 ./cmd/authzcheck
      - name: Bafflewick acceptance
        shell: bash
        run: |
          out=$(./bin/authzcheck -policy examples/bafflewick/policy.json -request examples/bafflewick/request.json)
          echo "$out" | grep -q '"allowed":true'
      - name: Boundary acceptance
        run: go test ./internal/authz -run 'TestCompartment|TestRoles|TestAssignmentAndObserverReadBoundary|TestMakerChecker|TestAgentInheritsHuman' -count=1
